<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">The content factory behind the app</title>
  <desc id="pipe-desc">Lesson JSON sources pass through schema and source validators, a text-to-speech provider, audio alignment and AAC encoding, then a pack with a manifest and SHA-256 hashes. The Flutter app reads the pack offline; no server is needed at runtime.</desc>
  <defs>
    <marker id="parrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#28627b"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
    <text x="20" y="28" font-size="16" letter-spacing="1.4" fill="#677179">BATCH, NOT A REQUEST PATH</text>
    <text x="20" y="55" font-family="Georgia, serif" font-size="30" font-weight="600" fill="#222629">A pack is built, hashed, and then read offline.</text>

    <g transform="translate(20 92)">
      <rect x="0" y="0" width="150" height="92" rx="4" fill="#f4f7f8" stroke="#dce1e4"/>
      <text x="14" y="24" font-size="18" font-weight="600" fill="#222629">Lesson sources</text>
      <text x="14" y="46" font-size="15" fill="#67748c">target items</text>
      <text x="14" y="63" font-size="15" fill="#67748c">segments</text>
      <text x="14" y="80" font-size="15" fill="#67748c">checks + prompts</text>

      <path d="M158 46 H190" stroke="#28627b" stroke-width="1.5" marker-end="url(#parrow)"/>

      <rect x="198" y="0" width="150" height="92" rx="4" fill="#f4f7f8" stroke="#dce1e4"/>
      <text x="212" y="24" font-size="18" font-weight="600" fill="#222629">Validators</text>
      <text x="212" y="46" font-size="15" fill="#67748c">schema + ids</text>
      <text x="212" y="63" font-size="15" fill="#67748c">source facts</text>
      <text x="212" y="80" font-size="15" fill="#67748c">target coverage</text>

      <path d="M356 46 H388" stroke="#28627b" stroke-width="1.5" marker-end="url(#parrow)"/>

      <rect x="396" y="0" width="150" height="92" rx="4" fill="#f4f7f8" stroke="#dce1e4"/>
      <text x="410" y="24" font-size="18" font-weight="600" fill="#222629">TTS</text>
      <text x="410" y="46" font-size="15" fill="#67748c">Edge es-MX now</text>
      <text x="410" y="63" font-size="15" fill="#67748c">Gemini ready</text>
      <text x="410" y="80" font-size="15" fill="#67748c">24 kHz mono</text>

      <path d="M554 46 H586" stroke="#28627b" stroke-width="1.5" marker-end="url(#parrow)"/>

      <rect x="594" y="0" width="150" height="92" rx="4" fill="#f4f7f8" stroke="#dce1e4"/>
      <text x="608" y="24" font-size="18" font-weight="600" fill="#222629">Align + encode</text>
      <text x="608" y="46" font-size="15" fill="#67748c">AAC/M4A</text>
      <text x="608" y="63" font-size="15" fill="#67748c">VTT + timings</text>
      <text x="608" y="80" font-size="15" fill="#67748c">segment gaps</text>

      <path d="M752 46 H784" stroke="#28627b" stroke-width="1.5" marker-end="url(#parrow)"/>

      <rect x="792" y="0" width="188" height="92" rx="4" fill="#28627b"/>
      <text x="806" y="24" font-size="18" font-weight="600" fill="#ffffff">Pack + catalog</text>
      <text x="806" y="46" font-size="15" fill="#d6e6ec">manifest + SHA-256</text>
      <text x="806" y="63" font-size="15" fill="#d6e6ec">atomic version</text>
      <text x="806" y="80" font-size="15" fill="#d6e6ec">app assets</text>
    </g>

    <g transform="translate(20 220)">
      <rect x="0" y="0" width="960" height="48" rx="4" fill="#faf6f1" stroke="#e6d6c8"/>
      <text x="16" y="29" font-size="16" fill="#ac6538" font-weight="600">Runtime:</text>
      <text x="100" y="29" font-size="15" fill="#5c4a3c">Flutter reads the pack from local assets · SQLite is the source of truth · no server, no account, no network required.</text>
    </g>
  </g>
</svg>
