<title id="f1t">Time from tapping Scan to a live camera frame on the emulator</title>
<desc id="f1d">A1 opens the device at 88 to 228 milliseconds and never reports frames. P2 shows a live frame at 179 ms, P4 at 153 ms. P1 paints a frozen frame at 12 ms and live frames at 206 to 524 ms.</desc>
