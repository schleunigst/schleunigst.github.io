<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="loop-title loop-desc">
  <title id="loop-title">Four ways into one language-learning loop</title>
  <desc id="loop-desc">Drive mode is audio-only for 30 to 45 minutes. Desk mode is 20 to 30 minutes with transcript, checks, and writing. Micro mode is 5 to 10 minutes with one segment, three recall items, and one sentence. Checkpoint is 15 to 25 minutes with unseen listening, a writing sample, and a self-rating. All four share listen, notice, retrieve, produce, and review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#28627b"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
    <text x="20" y="26" font-size="16" letter-spacing="1.4" fill="#677179">FOUR WAYS IN</text>
    <text x="20" y="52" font-family="Georgia, serif" font-size="30" font-weight="600" fill="#222629">One loop. The mode changes the surface.</text>

    <g>
      <rect x="20" y="78" width="220" height="172" rx="4" fill="#f4f7f8" stroke="#dce1e4"/>
      <rect x="20" y="78" width="4" height="172" rx="2" fill="#28627b"/>
      <text x="40" y="106" font-size="15" font-weight="600" fill="#222629">Drive</text>
      <text x="40" y="126" font-size="16" fill="#677179">30–45 min · audio only</text>
      <text x="40" y="154" font-size="16" fill="#3d4a52">One core episode</text>
      <text x="40" y="172" font-size="16" fill="#3d4a52">Think-the-answer prompts</text>
      <text x="40" y="190" font-size="16" fill="#3d4a52">No screen, no speaking</text>
      <text x="40" y="222" font-size="15" fill="#28627b">input stays cheap</text>
    </g>

    <g>
      <rect x="260" y="78" width="220" height="172" rx="4" fill="#f4f7f8" stroke="#dce1e4"/>
      <rect x="260" y="78" width="4" height="172" rx="2" fill="#28627b"/>
      <text x="280" y="106" font-size="15" font-weight="600" fill="#222629">Desk</text>
      <text x="280" y="126" font-size="16" fill="#677179">20–30 min · written first</text>
      <text x="280" y="154" font-size="16" fill="#3d4a52">Listen, then reveal text</text>
      <text x="280" y="172" font-size="16" fill="#3d4a52">Comprehension + writing</text>
      <text x="280" y="190" font-size="16" fill="#3d4a52">Due review first</text>
      <text x="280" y="222" font-size="15" fill="#28627b">production is the point</text>
    </g>

    <g>
      <rect x="500" y="78" width="220" height="172" rx="4" fill="#f4f7f8" stroke="#dce1e4"/>
      <rect x="500" y="78" width="4" height="172" rx="2" fill="#ac6538"/>
      <text x="520" y="106" font-size="15" font-weight="600" fill="#222629">Micro</text>
      <text x="520" y="126" font-size="16" fill="#677179">5–10 min · low energy</text>
      <text x="520" y="154" font-size="16" fill="#3d4a52">One 20–90 s segment</text>
      <text x="520" y="172" font-size="16" fill="#3d4a52">Three recall items</text>
      <text x="520" y="190" font-size="16" fill="#3d4a52">One written sentence</text>
      <text x="520" y="222" font-size="15" fill="#ac6538">the habit survives</text>
    </g>

    <g>
      <rect x="740" y="78" width="240" height="172" rx="4" fill="#f4f7f8" stroke="#dce1e4"/>
      <rect x="740" y="78" width="4" height="172" rx="2" fill="#ac6538"/>
      <text x="760" y="106" font-size="15" font-weight="600" fill="#222629">Checkpoint</text>
      <text x="760" y="126" font-size="16" fill="#677179">15–25 min · monthly</text>
      <text x="760" y="154" font-size="16" fill="#3d4a52">Unseen listening slice</text>
      <text x="760" y="172" font-size="16" fill="#3d4a52">Writing sample</text>
      <text x="760" y="190" font-size="16" fill="#3d4a52">Four self-ratings</text>
      <text x="760" y="222" font-size="15" fill="#ac6538">trend, not a CEFR claim</text>
    </g>

    <g transform="translate(20 286)">
      <text x="0" y="0" font-size="15" letter-spacing="1.2" fill="#677179">THE SAME CORE LOOP</text>
      <g transform="translate(0 18)">
        <rect x="0" y="0" width="132" height="38" rx="3" fill="#28627b"/>
        <text x="66" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Listen</text>
        <path d="M140 19 H166" stroke="#28627b" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="174" y="0" width="132" height="38" rx="3" fill="#f4f7f8" stroke="#dce1e4"/>
        <text x="240" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#222629">Notice</text>
        <path d="M314 19 H340" stroke="#28627b" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="348" y="0" width="132" height="38" rx="3" fill="#f4f7f8" stroke="#dce1e4"/>
        <text x="414" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#222629">Retrieve</text>
        <path d="M488 19 H514" stroke="#28627b" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="522" y="0" width="132" height="38" rx="3" fill="#f4f7f8" stroke="#dce1e4"/>
        <text x="588" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#222629">Produce</text>
        <path d="M662 19 H688" stroke="#28627b" stroke-width="1.5" marker-end="url(#arrow)"/>
        <rect x="696" y="0" width="132" height="38" rx="3" fill="#f4f7f8" stroke="#dce1e4"/>
        <text x="762" y="24" text-anchor="middle" font-size="17" font-weight="600" fill="#222629">Review later</text>
        <path d="M828 38 C880 60 900 60 930 38" fill="none" stroke="#ac6538" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
        <text x="838" y="66" font-size="14" fill="#ac6538">spacing brings it back</text>
      </g>
    </g>
  </g>
</svg>
