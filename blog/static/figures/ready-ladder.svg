<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-labelledby="wlt wld" width="720" height="240">
<title id="wlt">Four camera "ready" states: extra current draw versus reopen latency on a Galaxy S24 FE</title>
<desc id="wld">Streaming costs about 430 mA above camera-off and is already live; a stopped session costs 207 mA and reopens in 266 ms with the indicator dark; an open device without a session costs 33 mA and reopens in about one second; fully closed costs nothing and reopens in about 1.3 seconds.</desc>
