<text x="8.0" y="62.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#222629" text-anchor="start" font-weight="400" >A1 / A2 mobile_scanner</text>
<circle cx="133.7" cy="58" r="3" fill="none" stroke="#677179" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="572.8" cy="58" r="5.5" fill="#ac6538"/>
<circle cx="637.9" cy="58" r="5.5" fill="#28627b"/>
<line x1="132.0" y1="124" x2="680.0" y2="124" stroke="#dce1e4" stroke-width="1"/>
<text x="8.0" y="128.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#222629" text-anchor="start" font-weight="400" >P1–P4 plugin</text>
<circle cx="133.7" cy="124" r="3" fill="none" stroke="#677179" stroke-width="1" stroke-dasharray="2 2"/>
<circle cx="196.4" cy="124" r="5.5" fill="#ac6538"/>
<circle cx="263.5" cy="124" r="5.5" fill="#28627b"/>
<text x="141.7" y="46.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="10" fill="#677179" text-anchor="start" font-weight="400" >stop() ack ≈ 5 ms</text>
<text x="572.8" y="46.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#ac6538" text-anchor="middle" font-weight="400" >camera really free 1.29 s</text>
<text x="637.9" y="78.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#28627b" text-anchor="middle" font-weight="400" >RFID ok 1.48 s</text>
<text x="206.4" y="112.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#ac6538" text-anchor="start" font-weight="400" >free 0.19 s</text>
