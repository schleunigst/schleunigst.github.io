<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 176" role="img" aria-labelledby="f4t f4d" width="720" height="176">
<title id="f4t">Camera release and RFID start after leaving the scan tab</title>
<desc id="f4d">The mobile_scanner apps release the camera 1.29 seconds after the tap and start RFID at 1.48 seconds; the plugin apps release at 0.19 seconds and start RFID at 0.38 seconds.</desc>
