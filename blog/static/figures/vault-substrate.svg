<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 274" role="img" aria-labelledby="vst vsd" width="720" height="274">
<title id="vst">Three representations of one idea vault: an append-only event log folded into disposable projections, read by three kinds of client</title>
<desc id="vsd">The append-only log holds every idea, edge, proposal and review, and is the only authority. A deterministic fold produces three projections: a typed graph, a full-text index, and embedding vectors. The Flutter app, the command line, and an MCP server for agents read those projections and append to the same log. Derived data can be deleted and rebuilt from the log at any time.</desc>
