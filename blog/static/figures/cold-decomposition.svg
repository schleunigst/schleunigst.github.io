<text x="203.6" y="63.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="start" font-weight="600" >CameraX + mobile_scanner ≈ 5.33 s</text>
