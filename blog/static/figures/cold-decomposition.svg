<title id="f2t">Where the cold 5.76 second bind went</title>
<desc id="f2d">The cold mobile_scanner bind takes 5.76 seconds: about 0.43 seconds of camera work and about 5.33 seconds of CameraX and scanner overhead. The direct camera2 path opens and delivers a first frame in 0.43 seconds cold.</desc>
